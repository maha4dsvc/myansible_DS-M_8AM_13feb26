---
- hosts: 172.31.35.71
  become: yes
  tasks:
  - include_tasks: myfile.yml

  - name: create a folder
    file: 
       path: /home/maha/myfolder
       state: directory

  - name: copy static file into node side
    copy: 
       src: mystaticfile
       dest: /home/maha/myfolder/mystaticfile

  - name: install webserver
    apt:
      name: apache2
      state: present
